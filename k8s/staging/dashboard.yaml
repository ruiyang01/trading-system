apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: trading-system-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: dashboard
          image: /trading-dashboard:c816936a41a127567460b3c6f83c279c100e8989
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATABASE_URL
              value: postgresql://trader:trader123@postgres:5432/trading
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: trading-system-staging
spec:
  type: LoadBalancer
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 8000