# Default deny all ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: trading-system-staging
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Dashboard: allow from internet
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard
  namespace: trading-system-staging
spec:
  podSelector:
    matchLabels:
      app: dashboard
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000

---
# Redis: allow from trading services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: trading-system-staging
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: data-fetcher
        - podSelector:
            matchLabels:
              app: strategy-engine
        - podSelector:
            matchLabels:
              app: executor
        - podSelector:
            matchLabels:
              app: dashboard
      ports:
        - protocol: TCP
          port: 6379

---
# Postgres: allow from executor and dashboard only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: trading-system-staging
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: executor
        - podSelector:
            matchLabels:
              app: dashboard
      ports:
        - protocol: TCP
          port: 5432