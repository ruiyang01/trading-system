name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio httpx redis asyncpg
      
      - name: Run tests
        run: |
          pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build data-fetcher
        run: docker build -t trading-system/data-fetcher:latest ./services/data-fetcher
      
      - name: Build strategy-engine
        run: docker build -t trading-system/strategy-engine:latest ./services/strategy-engine
      
      - name: Build executor
        run: docker build -t trading-system/executor:latest ./services/executor
      
      - name: Build dashboard
        run: docker build -t trading-system/dashboard:latest ./services/dashboard
      
      - name: Build success
        run: echo "✅ All images built successfully!"