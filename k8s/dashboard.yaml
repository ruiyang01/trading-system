apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: trading-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: dashboard
          image: 491325670398.dkr.ecr.eu-central-1.amazonaws.com/trading-dashboard:d539a557c36bda9892e862522ce5cfcfe72969d3
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATABASE_URL
              value: postgresql://trader:trader123@postgres:5432/trading
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: trading-system
spec:
  type: ClusterIP
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 8000