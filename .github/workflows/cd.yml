name: CD

on:
  push:
    branches: [main]
    paths:
      - 'services/**'

permissions:
  contents: write
  
env:
  AWS_REGION: eu-central-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    outputs:
      image_tag: ${{ github.sha }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          services=("data-fetcher" "strategy-engine" "executor" "dashboard")
          for service in "${services[@]}"; do
            echo "Building $service..."
            docker build -t $ECR_REGISTRY/trading-$service:$IMAGE_TAG ./services/$service
            docker push $ECR_REGISTRY/trading-$service:$IMAGE_TAG
            echo "✅ $service pushed"
          done
      
      - name: Update K8s manifests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Update image tags in k8s manifests
          sed -i "s|image: .*|image: $ECR_REGISTRY/trading-data-fetcher:$IMAGE_TAG|" k8s/data-fetcher.yaml
          sed -i "s|image: .*|image: $ECR_REGISTRY/trading-strategy-engine:$IMAGE_TAG|" k8s/strategy-engine.yaml
          sed -i "s|image: .*|image: $ECR_REGISTRY/trading-executor:$IMAGE_TAG|" k8s/executor.yaml
          sed -i "s|image: .*trading-dashboard.*|image: $ECR_REGISTRY/trading-dashboard:$IMAGE_TAG|" k8s/dashboard.yaml

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/
          git diff --staged --quiet || git commit -m "Update images to ${{ github.sha }}"
          git push
