apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: trading-system-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: executor
          image: 491325670398.dkr.ecr.eu-central-1.amazonaws.com/trading-executor:c816936a41a127567460b3c6f83c279c100e8989
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: connection-string
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi