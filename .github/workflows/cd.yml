name: CD

on:
  push:
    branches: 
      - main
    paths:
      - 'services/**'

permissions:
  contents: write

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 491325670398.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          services=("data-fetcher" "strategy-engine" "executor" "dashboard")
          for service in "${services[@]}"; do
            echo "Building $service..."
            docker build -t ${{ env.ECR_REGISTRY }}/trading-$service:$IMAGE_TAG ./services/$service
            docker push ${{ env.ECR_REGISTRY }}/trading-$service:$IMAGE_TAG
            echo "✅ $service pushed"
          done

  update-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update staging manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for file in k8s/staging/data-fetcher.yaml k8s/staging/strategy-engine.yaml k8s/staging/executor.yaml k8s/staging/dashboard.yaml; do
            service=$(basename $file .yaml)
            sed -i "s|image:.*trading-${service}.*|image: ${{ env.ECR_REGISTRY }}/trading-${service}:$IMAGE_TAG|" $file
          done
          
          echo "Updated images:"
          grep "image:" k8s/staging/*.yaml  
      
      - name: Commit and push changes
        run: |
          git config user.name "ruiyang01"
          git config user.email "122395031+ruiyang01@users.noreply.github.com"
          git add k8s/
          git diff --staged --quiet || git commit -m "Deploy to staging: ${{ github.sha }}"
          git push