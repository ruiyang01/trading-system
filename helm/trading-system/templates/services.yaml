# Data Fetcher
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-fetcher
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas.dataFetcher }}
  selector:
    matchLabels:
      app: data-fetcher
  template:
    metadata:
      labels:
        app: data-fetcher
    spec:
      containers:
        - name: data-fetcher
          image: {{ .Values.image.registry }}/trading-data-fetcher:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REDIS_URL
              value: redis://redis:6379
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
---
# Strategy Engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-engine
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas.strategyEngine }}
  selector:
    matchLabels:
      app: strategy-engine
  template:
    metadata:
      labels:
        app: strategy-engine
    spec:
      containers:
        - name: strategy-engine
          image: {{ .Values.image.registry }}/trading-strategy-engine:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REDIS_URL
              value: redis://redis:6379
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
---
# Executor
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas.executor }}
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      containers:
        - name: executor
          image: {{ .Values.image.registry }}/trading-executor:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentials.secretName }}
                  key: connection-string
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
