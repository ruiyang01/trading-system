name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio httpx redis asyncpg
      
      - name: Run tests
        run: |
          pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build all services
        run: |
          docker build -t trading-system/data-fetcher:${{ github.sha }} ./services/data-fetcher
          docker build -t trading-system/strategy-engine:${{ github.sha }} ./services/strategy-engine
          docker build -t trading-system/executor:${{ github.sha }} ./services/executor
          docker build -t trading    tem/dashbo          docker build -ter   es/dashboard
          docker build -t ages built successfully!"
