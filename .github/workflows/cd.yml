name: CD

on:
  push:
    branches: 
      - main
      - production
    paths:
      - 'services/**'

permissions:
  contents: write

env:
  AWS_REGION: eu-central-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          services=("data-fetcher" "strategy-engine" "executor" "dashboard")
          for service in "${services[@]}"; do
            echo "Building $service..."
            docker build -t $ECR_REGISTRY/trading-$service:$IMAGE_TAG ./services/$service
            docker build -t $ECR_REGISTRY/trading-$service:latest ./services/$service
            docker push $ECR_REGISTRY/trading-$service:$IMAGE_TAG
            docker push $ECR_REGISTRY/trading-$service:latest
            echo "✅ $service pushed with tags: $IMAGE_TAG, latest"
          done

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Update staging manifests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: .*trading-data-fetcher.*|image: $ECR_REGISTRY/trading-data-fetcher:$IMAGE_TAG|" k8s/staging/data-fetcher.yaml
          sed -i "s|image: .*trading-strategy-engine.*|image: $ECR_REGISTRY/trading-strategy-engine:$IMAGE_TAG|" k8s/staging/strategy-engine.yaml
          sed -i "s|image: .*trading-executor.*|image: $ECR_REGISTRY/trading-executor:$IMAGE_TAG|" k8s/staging/executor.yaml
          sed -i "s|image: .*trading-dashboard.*|image: $ECR_REGISTRY/trading-dashboard:$IMAGE_TAG|" k8s/staging/dashboard.yaml
      
      - name: Commit and push changes
        run: |
          git config user.name "ruiyang01"
          git config user.email "122395031+ruiyang01@users.noreply.github.com"
          git add k8s/
          git diff --staged --quiet || git commit -m "Deploy to staging: ${{ github.sha }}"
          git push

  deploy-production:
    needs: build-and-push
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Update production manifests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: .*trading-data-fetcher.*|image: $ECR_REGISTRY/trading-data-fetcher:$IMAGE_TAG|" k8s/production/data-fetcher.yaml
          sed -i "s|image: .*trading-strategy-engine.*|image: $ECR_REGISTRY/trading-strategy-engine:$IMAGE_TAG|" k8s/production/strategy-engine.yaml
          sed -i "s|image: .*trading-executor.*|image: $ECR_REGISTRY/trading-executor:$IMAGE_TAG|" k8s/production/executor.yaml
          sed -i "s|image: .*trading-dashboard.*|image: $ECR_REGISTRY/trading-dashboard:$IMAGE_TAG|" k8s/production/dashboard.yaml
      
      - name: Commit and push
        run: |
          git config user.name "ruiyang01"
          git config user.email "122395031+ruiyang01@users.noreply.github.com"
          git add k8s/production/
          git diff --staged --quiet || git commit -m "Deploy to production: ${{ github.sha }}"
          git push