apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: trading-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: executor
          image: 491325670398.dkr.ecr.eu-central-1.amazonaws.com/trading-executor:latest
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATABASE_URL
              value: postgresql://trader:trader123@postgres:5432/trading
            - name: LOG_LEVEL
              value: INFO