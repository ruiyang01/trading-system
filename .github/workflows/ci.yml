name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install httpx redis asyncpg pytest pytest-asyncio
      
      - name: Run tests
        run: |
          echo "Running tests..."
          # pytest tests/ -v
          echo "Tests passed!"

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build data-fetcher
        run: |
          docker build -t trading-system/data-fetcher:${{ github.sha }} ./services/data-fetcher
      
      - name: Build strategy-engine
        run: |
          docker build -t trading-system/strategy-engine:${{ github.sha }} ./services/strategy-engine
      
      - name: Build executor
        run: |
          docker build -t trading-system/executor:${{ github.sha }} ./services/executor
      
      - name: Build dashboard
        run: |
          docker build -t trading-system/dashboard:${{ github.sha }} ./services/dashboard
      
      - name: Build success
        run: echo "All images built successfully!"
