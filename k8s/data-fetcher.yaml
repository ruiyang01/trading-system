apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-fetcher
  namespace: trading-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-fetcher
  template:
    metadata:
      labels:
        app: data-fetcher
    spec:
      containers:
        - name: data-fetcher
          image: 491325670398.dkr.ecr.eu-central-1.amazonaws.com/trading-data-fetcher:645f0a5c23040defb3cfa4b4da6ac9348ae496aa
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: LOG_LEVEL
              value: INFO
